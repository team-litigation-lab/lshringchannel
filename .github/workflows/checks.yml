# Runs on every pull request and every push to main. A failure shows as a red "Checks" status on the
# PR/commit with a readable log, and GitHub emails the person who pushed. Nothing here deploys.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Wrangler from package.json; Playwright and ws from tests/package.json (Chromium to match).
      - name: Install Wrangler, Playwright and Chromium
        run: |
          npm ci
          npm ci --prefix tests
          tests/node_modules/.bin/playwright install --with-deps chromium
      - name: Build the Worker without deploying (wrangler dry run)
        run: npm run check
      - name: Live calls, AI practice and the Blueprint (two browsers, local wrangler dev)
        run: bash tests/run.sh
