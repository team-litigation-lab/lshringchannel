<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LSH Ring Channel</title>
<meta name="description" content="A training phone system for Receptionist and Intake mock calls: live calls between trainer and trainee, and AI practice callers.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top" id="top">
  <div class="brand"><span class="logo">☎</span><span>LSH Ring Channel <small>Training VOIP</small></span></div>
  <nav class="nav" id="nav"></nav>
  <div class="who" id="who"></div>
</header>
<div id="netbar" class="netbar hidden">Reconnecting to the phone system…</div>
<div id="oncall" class="oncall-bar hidden"></div>
<main id="app"><div class="empty">Loading…</div></main>
<audio id="remoteAudio" autoplay playsinline></audio>
<div id="toast" aria-live="polite"></div>
<script src="js/api.js"></script>
<script src="js/sounds.js"></script>
<script src="js/phone.js"></script>
<script src="js/ai-call.js"></script>
<script src="js/app.js"></script>
<script src="js/trainee.js"></script>
<script src="js/console.js"></script>
<script src="js/review.js"></script>
<script src="js/classview.js"></script>
<script src="js/request-budget.js"></script>
<script>
App.boot();
// 📊 Server request meter, for trainers: how much of the Cloudflare account's monthly request allowance (shared by
// every LSH site) is used. Not in the Class view, which the class sees. README → Server request meter.
RequestBudget.start({ load: () => API.post('/api/request-budget'), isAdmin: () => App.trainer() && !App.isClassView, site: 'lshringchannel' });
</script>
</body>
</html>
